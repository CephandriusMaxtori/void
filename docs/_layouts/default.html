<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="dot" aria-hidden="true"></span>
      {{ site.title }}
    </a>
    <nav aria-label="Main">
      <ul>
        {% for item in site.data.nav %}
        <li><a href="{{ item.url | relative_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
        <li><a href="https://github.com/CephandriusMaxtori/void" rel="noopener">GitHub</a></li>
      </ul>
    </nav>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      <span class="dot" aria-hidden="true"></span>
      Licensed Apache 2.0. Bundled Doto font is OFL — see
      <a href="https://github.com/CephandriusMaxtori/void/blob/main/NOTICE">NOTICE</a>.
    </p>
  </footer>
</body>
</html>
