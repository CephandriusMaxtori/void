name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See build.yml. gradlew is stored as 100755, but core.fileMode is false
      # on Windows so the exec bit can be lost on re-commit.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The keystore never enters the repo. It is base64-encoded in a repo
      # secret and decoded into the runner's temp dir at build time.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.VOID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::VOID_KEYSTORE_B64 secret is not set. Cannot sign a release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/void-release.jks"
          echo "Keystore decoded to $RUNNER_TEMP/void-release.jks"

      - name: Assemble signed release
        env:
          VOID_KEYSTORE_FILE: ${{ runner.temp }}/void-release.jks
          VOID_KEYSTORE_PASSWORD: ${{ secrets.VOID_KEYSTORE_PASSWORD }}
          VOID_KEY_ALIAS: ${{ secrets.VOID_KEY_ALIAS }}
          VOID_KEY_PASSWORD: ${{ secrets.VOID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "Publishing $APK to $TAG"
          gh release upload "$TAG" "$APK" --clobber

      - name: Summarise release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Void Launcher $TAG"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in app/build/outputs/apk/release/*.apk; do
              [ -e "$f" ] || continue
              size=$(du -h "$f" | cut -f1)
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| \`$(basename "$f")\` | $size | \`$sha\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
