name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    name: Assemble + verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub runners export ANDROID_HOME, so the gitignored local.properties
      # is not needed here. Local builds DO need it.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Provides the dependency cache and the Gradle build cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify toolchain
        run: ./gradlew --version

      - name: Compile Kotlin + resources
        run: ./gradlew assembleDebug --stacktrace

      # R8 and resource shrinking only run in release. Building it in CI is how
      # shrinker breakage gets caught before it reaches a device.
      - name: Build release (exercises R8 + resource shrinking)
        run: ./gradlew assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: void-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: void-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
