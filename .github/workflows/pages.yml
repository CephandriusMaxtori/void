name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages. This is the only scope it
# needs, and it is deliberately narrow: contents:read cannot write to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a deploy in flight — a half-finished Pages
# upload is worse than a queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # setup-ruby will not guess a version when there is no .ruby-version
          # or .tool-versions file, and fails with "input ruby-version needs to
          # be specified". Pinned rather than floating so the docs build stays
          # reproducible.
          ruby-version: '3.3'
          # Reads docs/Gemfile, caches gems against its lockfile.
          bundler-cache: true
          working-directory: docs

      - name: Configure Jekyll
        run: |
          cd docs
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    name: Deploy
    needs: build
    # Pull requests build the site to prove it compiles, but must never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
