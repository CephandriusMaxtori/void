version: 2

updates:
  # GitHub Actions. This one works today.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [ dependencies, ci ]
    groups:
      actions:
        patterns: [ 'actions/*', 'gradle/*' ]

  # Gradle updates are DISABLED until Phase 1 lands a real build.
  #
  # Dependabot's Gradle parser needs a resolvable build to work from. Right now
  # the root project is a placeholder with no build.gradle.kts and there is no
  # /benchmark module, so every Gradle update PR comes back red — which trains
  # you to ignore red. Re-enable once :app assembles.
  #
  # Re-enable by uncommenting the two blocks below.
  #
  # - package-ecosystem: gradle
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   commit-message:
  #     prefix: build
  #   labels: [ dependencies, build ]
  #   groups:
  #     agp:
  #       patterns: [ 'com.android.*' ]
  #     kotlin:
  #       patterns: [ 'org.jetbrains.kotlin*' ]
  #     androidx:
  #       patterns: [ 'androidx.*' ]
  #     ksp:
  #       patterns: [ 'com.google.devtools.ksp*' ]
  #
  # - package-ecosystem: gradle
  #   directory: /benchmark
  #   schedule:
  #     interval: weekly
  #   commit-message:
  #     prefix: build
  #   labels: [ dependencies, build ]
